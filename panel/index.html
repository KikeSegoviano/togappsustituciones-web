<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel — TogApp</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../assets/estilo.css">
  <style>
    [hidden] { display: none !important; }
    header.sitio .usuario { font-size: 0.85rem; color: var(--suave); display: flex; gap: 0.75rem; align-items: center; }
    header.sitio .usuario button { background: none; border: 0; color: var(--acento); cursor: pointer; font-size: 0.85rem; padding: 0; }
    .tabs { display: flex; gap: 0.2rem; margin: 1.25rem 0 0.5rem; border-bottom: 1px solid var(--borde); overflow-x: auto; }
    .tabs button {
      background: none; border: 0; border-bottom: 3px solid transparent; padding: 0.6rem 0.7rem;
      font-size: 0.95rem; font-weight: 600; color: var(--suave); cursor: pointer; white-space: nowrap;
    }
    .tabs button[aria-selected="true"] { color: var(--acento); border-bottom-color: var(--acento); }
    .progreso { margin: 1rem 0 0.25rem; font-weight: 600; color: var(--tinta); }
    .tarjeta { padding: 1.1rem 1.2rem; margin: 0.9rem 0; }
    .tarjeta h3 { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
    .meta { font-size: 0.85rem; color: var(--suave); margin-bottom: 0.6rem; }
    .texto-msg {
      background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px;
      padding: 0.7rem 0.85rem; font-size: 0.93rem; white-space: pre-wrap; margin: 0.5rem 0;
    }
    .aviso { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 0.55rem 0.8rem; font-size: 0.87rem; margin: 0.5rem 0; }
    .acciones { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
    .boton { font-size: 0.93rem; padding: 0.55rem 1rem; }
    .boton.sec { background: var(--blanco); color: var(--acento); border: 1px solid var(--acento); }
    .boton.sec:hover { background: #eff6ff; }
    .boton.gris { background: var(--blanco); color: var(--suave); border: 1px solid var(--borde); font-weight: 600; }
    .boton.gris:hover { background: var(--fondo); }
    .boton:disabled { opacity: 0.5; cursor: wait; }
    .vacio { color: var(--suave); padding: 1rem 0; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .tile { background: var(--blanco); border: 1px solid var(--borde); border-radius: 12px; padding: 0.9rem 1rem; }
    .tile .num { font-size: 1.7rem; font-weight: 800; color: var(--tinta); line-height: 1.2; }
    .tile .lbl { font-size: 0.82rem; color: var(--suave); }
    .campo input[type="password"], .campo textarea {
      width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--borde); border-radius: 8px;
      font-size: 1rem; background: var(--blanco); font-family: inherit;
    }
    dialog { border: 0; border-radius: 12px; padding: 1.4rem; max-width: 440px; width: calc(100% - 2rem); box-shadow: 0 10px 40px rgba(15, 23, 42, 0.25); }
    dialog::backdrop { background: rgba(15, 23, 42, 0.45); }
    dialog h2 { margin-top: 0; }
    .error { color: #b91c1c; font-size: 0.9rem; min-height: 1.2rem; }
    /* ---------- Gráficos (método y paleta validados con la skill dataviz) ---------- */
    .viz { --serie-1: #2a78d6; --serie-2: #eb6834; --serie-3: #1baf7a; --rejilla: #e1e0d9; --eje: #c3c2b7; }
    .grafico { background: var(--blanco); border: 1px solid var(--borde); border-radius: 12px; padding: 1rem 1.1rem; margin: 0.9rem 0; }
    .grafico h3 { margin: 0 0 0.15rem; }
    .grafico .sub { font-size: 0.85rem; color: var(--suave); margin-bottom: 0.8rem; }
    .barras .fila { display: grid; grid-template-columns: minmax(96px, 36%) 1fr; gap: 0.6rem; align-items: center; padding: 0.22rem 0; border-radius: 6px; outline: none; }
    .barras .fila:hover, .barras .fila:focus-visible { background: var(--fondo); }
    .barras .lbl { font-size: 0.86rem; color: var(--texto); overflow-wrap: anywhere; line-height: 1.25; }
    .barras .pista { display: flex; align-items: center; gap: 0.45rem; min-width: 0; }
    .barras .barra { height: 16px; background: var(--serie-1); border-radius: 0 4px 4px 0; min-width: 2px; flex: 0 0 auto; }
    .barras .val { font-size: 0.84rem; color: var(--tinta); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .barras .val small { color: var(--suave); font-weight: 400; font-size: 0.8rem; }
    .leyenda { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.84rem; color: var(--texto); margin-bottom: 0.4rem; }
    .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.35rem; }
    .lienzo { min-height: 220px; }
    .lienzo svg { display: block; }
    .lienzo .eje { font-size: 11px; fill: var(--suave); font-variant-numeric: tabular-nums; }
    .lienzo .cap { font-size: 11px; fill: var(--tinta); font-weight: 600; }
    .lienzo .banda { fill: transparent; outline: none; }
    .lienzo .banda:hover, .lienzo .banda:focus { fill: rgba(15, 23, 42, 0.05); }
    details.tabla-alt { margin-top: 0.6rem; font-size: 0.86rem; }
    details.tabla-alt summary { cursor: pointer; color: var(--acento); }
    .tabla-num { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 0.4rem; }
    .tabla-num th, .tabla-num td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--borde); text-align: right; font-variant-numeric: tabular-nums; }
    .tabla-num th:first-child, .tabla-num td:first-child { text-align: left; }
    .tabla-num th { color: var(--suave); font-weight: 600; font-size: 0.8rem; }
    .tabla-num tr.grupo td { background: var(--fondo); font-weight: 700; color: var(--tinta); text-align: left; }
    .desliza { overflow-x: auto; }
    #tip {
      position: fixed; z-index: 20; background: var(--tinta); color: var(--blanco); border-radius: 8px;
      padding: 0.45rem 0.65rem; font-size: 0.82rem; pointer-events: none; max-width: 260px; line-height: 1.35;
    }
    #tip .tip-titulo { color: #cbd5e1; margin-bottom: 0.15rem; }
    #tip .tip-clave { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 0.4rem; vertical-align: middle; }
    /* ---------- Disposición ancha en escritorio ---------- */
    header.sitio .contenedor, main.contenedor { max-width: 1040px; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 0 0.9rem; align-items: start; }
    .rejilla > .ancho-total { grid-column: 1 / -1; }
    /* ---------- Etiquetas, chips y medidor ---------- */
    .badge { display: inline-block; font-size: 0.76rem; font-weight: 600; padding: 0.12rem 0.55rem; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
    .b-neutro { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
    .b-cola { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
    .b-activo { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .b-logro { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .b-fuera { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .b-seg { background: #f3e8ff; color: #6b21a8; border-color: #e9d5ff; }
    details.respuesta { border: 1px solid var(--borde); border-radius: 8px; padding: 0.45rem 0.7rem; margin: 0.35rem 0; background: var(--blanco); }
    details.respuesta summary { cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--tinta); }
    .chip { display: inline-block; font-size: 0.76rem; padding: 0.08rem 0.5rem; border-radius: 6px; background: var(--fondo); border: 1px solid var(--borde); color: var(--texto); white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .medidor { display: flex; align-items: center; gap: 0.45rem; }
    .medidor .n { font-weight: 700; color: var(--tinta); font-variant-numeric: tabular-nums; min-width: 1.6rem; text-align: right; }
    .medidor .pista-m { flex: 1; height: 6px; border-radius: 3px; background: #cde2fb; min-width: 40px; overflow: hidden; }
    .medidor .pista-m i { display: block; height: 100%; background: #2a78d6; border-radius: 3px; }
    /* ---------- Pestaña Despachos ---------- */
    .presets { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1rem 0 0.6rem; }
    .presets button { background: var(--blanco); border: 1px solid var(--borde); border-radius: 999px; padding: 0.35rem 0.8rem; font-size: 0.86rem; color: var(--texto); cursor: pointer; font-family: inherit; }
    .presets button b { color: var(--tinta); margin-left: 0.3rem; font-variant-numeric: tabular-nums; }
    .presets button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--blanco); }
    .presets button[aria-pressed="true"] b { color: var(--blanco); }
    .filtros { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 0.5rem; }
    .filtros input, .filtros select { padding: 0.5rem 0.6rem; border: 1px solid var(--borde); border-radius: 8px; font-size: 0.92rem; background: var(--blanco); font-family: inherit; max-width: 100%; }
    .filtros input { flex: 1 1 200px; min-width: 0; }
    .tabla-d { background: var(--blanco); border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; }
    .fila-d { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(0, 1fr) 120px 150px minmax(0, 1.5fr); gap: 0.8rem; align-items: center; padding: 0.6rem 0.9rem; border-top: 1px solid var(--borde); }
    .fila-d.cab { border-top: 0; background: var(--fondo); font-size: 0.78rem; font-weight: 600; color: var(--suave); padding: 0.45rem 0.9rem; }
    .fila-d:not(.cab) { cursor: pointer; outline: none; }
    .fila-d:not(.cab):hover, .fila-d:not(.cab):focus-visible { background: #f8fafc; box-shadow: inset 3px 0 0 var(--acento); }
    .fila-d .nombre { font-weight: 700; color: var(--tinta); overflow-wrap: anywhere; line-height: 1.3; }
    .fila-d .sub-d { font-size: 0.8rem; color: var(--suave); margin-top: 0.1rem; overflow-wrap: anywhere; }
    .fila-d .c-plaza { font-size: 0.9rem; }
    @media (max-width: 760px) {
      .fila-d.cab { display: none; }
      .fila-d { grid-template-columns: minmax(0, 1fr) 110px; gap: 0.35rem 0.8rem; }
      .fila-d .c-nombre { grid-column: 1 / -1; }
      .fila-d .c-plaza { grid-column: 1; grid-row: 2; font-size: 0.85rem; color: var(--suave); }
      .fila-d .c-score { grid-column: 2; grid-row: 2; }
      .fila-d .c-estado { grid-column: 1 / -1; grid-row: 3; }
      .fila-d .c-areas { grid-column: 1 / -1; grid-row: 4; }
      .tabs button { padding: 0.55rem 0.4rem; font-size: 0.86rem; }
      .tabla-num { font-size: 0.8rem; }
      .tabla-num th, .tabla-num td { padding: 0.35rem 0.3rem; }
    }
    /* ---------- Ficha (detalle, notas y seguimiento) ---------- */
    dialog.ficha { max-width: 720px; padding: 0; }
    .ficha .cabecera { padding: 1.1rem 1.3rem 0.8rem; border-bottom: 1px solid var(--borde); display: flex; gap: 0.8rem; justify-content: space-between; align-items: flex-start; }
    .ficha .cabecera h2 { margin: 0 0 0.3rem; font-size: 1.15rem; overflow-wrap: anywhere; }
    .ficha .cerrar { background: none; border: 0; font-size: 1.5rem; line-height: 1; color: var(--suave); cursor: pointer; padding: 0 0.2rem; }
    .ficha .cuerpo-f { padding: 0.4rem 1.3rem 1.3rem; max-height: min(74vh, 720px); overflow-y: auto; }
    .ficha h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--suave); margin: 1.1rem 0 0.45rem; }
    .ficha p { margin-bottom: 0.5rem; font-size: 0.92rem; }
    .desglose .fila-g { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 0.6rem; align-items: center; padding: 0.15rem 0; font-size: 0.86rem; }
    .linea-seg { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
    .linea-seg input[type="date"], .linea-seg input[type="text"] { padding: 0.45rem 0.55rem; border: 1px solid var(--borde); border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
    .linea-seg input[type="text"] { flex: 1 1 200px; min-width: 0; }
    .boton.mini { padding: 0.32rem 0.65rem; font-size: 0.82rem; }
    .ficha textarea { width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--borde); border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    .nota-item { border-left: 3px solid var(--borde); padding: 0.1rem 0 0.1rem 0.7rem; margin: 0.6rem 0; }
    .nota-item .quien { font-size: 0.78rem; color: var(--suave); display: flex; gap: 0.6rem; align-items: center; }
    .nota-item .quien button { background: none; border: 0; color: var(--acento); cursor: pointer; font-size: 0.78rem; padding: 0; }
    .nota-item .txt { white-space: pre-wrap; font-size: 0.92rem; overflow-wrap: anywhere; }
    .info-seg { font-size: 0.86rem; margin: 0.45rem 0 0; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .ultima-nota { font-size: 0.86rem; color: var(--texto); border-left: 3px solid var(--borde); padding-left: 0.6rem; margin: 0.45rem 0 0; overflow-wrap: anywhere; }
    .ultima-nota small { color: var(--suave); }
    #toast {
      position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
      background: var(--tinta); color: var(--blanco); padding: 0.6rem 1.1rem; border-radius: 999px;
      font-size: 0.9rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 90%;
    }
    #toast.visible { opacity: 1; }
  </style>
</head>
<body>
  <header class="sitio">
    <div class="contenedor">
      <a class="logo" href="./">Tog<span>App</span> · Panel</a>
      <span class="usuario" id="usuario" hidden>
        <span id="usuario-nombre"></span>
        <button type="button" id="btn-pass">Cambiar contraseña</button>
        <button type="button" id="btn-salir">Salir</button>
      </span>
    </div>
  </header>

  <main class="contenedor">
    <section id="login" class="tarjeta" hidden>
      <h2 style="margin-top:0">Entrar al panel</h2>
      <form id="form-login">
        <div class="campo">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="login-pass">Contraseña</label>
          <input type="password" id="login-pass" required autocomplete="current-password">
        </div>
        <p class="error" id="login-error"></p>
        <button class="boton" type="submit">Entrar</button>
      </form>
    </section>

    <section id="app" hidden>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="hoy">Hoy</button>
        <button type="button" role="tab" data-tab="curso">En curso</button>
        <button type="button" role="tab" data-tab="resultados">Resultados</button>
        <button type="button" role="tab" data-tab="despachos">Despachos</button>
        <button type="button" role="tab" data-tab="contenido">Contenido</button>
      </nav>
      <div id="vista"></div>
    </section>
  </main>

  <dialog id="dlg-optin">
    <form id="form-optin">
      <h2>Dio permiso para email</h2>
      <p class="nota">Solo si la persona ha dicho expresamente que quiere recibir información por
      email. Lo que escribas aquí es la prueba legal de su consentimiento.</p>
      <div class="campo">
        <label for="optin-email">Email que te ha dado</label>
        <input type="email" id="optin-email" required>
      </div>
      <div class="campo">
        <label for="optin-texto">Frase exacta con la que dio su permiso</label>
        <textarea id="optin-texto" rows="3" required placeholder="Ej.: Sí, mándame la info a este correo"></textarea>
      </div>
      <p class="error" id="optin-error"></p>
      <div class="acciones">
        <button class="boton" type="submit">Guardar permiso</button>
        <button class="boton gris" type="button" data-cerrar>Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-pass">
    <form id="form-pass">
      <h2>Cambiar contraseña</h2>
      <div class="campo">
        <label for="pass-nueva">Nueva contraseña (mínimo 10 caracteres)</label>
        <input type="password" id="pass-nueva" required minlength="10" autocomplete="new-password">
      </div>
      <p class="error" id="pass-error"></p>
      <div class="acciones">
        <button class="boton" type="submit">Guardar</button>
        <button class="boton gris" type="button" data-cerrar>Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-ficha" class="ficha">
    <div class="cabecera">
      <div>
        <h2 id="ficha-titulo"></h2>
        <div id="ficha-meta" class="chips"></div>
      </div>
      <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
    </div>
    <div class="cuerpo-f" id="ficha-cuerpo"></div>
  </dialog>

  <div id="toast" role="status"></div>
  <div id="tip" role="tooltip" hidden></div>

  <script src="plantillas.js"></script>
  <script src="contenido.js"></script>
  <script>
    // Panel del piloto LinkedIn. Habla solo con Supabase (Auth + RPC panel_datos / panel_accion).
    // La clave de abajo es la publicable: la seguridad está en el login + allowlist + RLS
    // (supabase/migrations/0008_panel.sql). Nada de innerHTML: los nombres de despacho vienen
    // de fuentes externas y se pintan siempre como texto.
    // Los textos que se envían (seguimiento, respuestas rápidas) salen de plantillas.js y las
    // publicaciones de la semana de contenido.js; si no cargan, el panel sigue funcionando sin ellos.
    const PL = window.PLANTILLAS || { SEGMENTOS: {}, VARIANTES: {}, motivo: () => null, respuestas: () => [], seguimiento: () => null };
    const CONTENIDO = window.CONTENIDO || [];
    const SB = "https://mkfywollbqgrcbkqmsbw.supabase.co";
    const KEY = "sb_publishable_DhbGJweY0WycbXj6YtzkOg_738er8cV";
    const LS = "togapp_panel_sesion";

    let sesion = null;
    let datos = null;
    let tab = "hoy";
    let optinLead = null;
    // Datos pesados: se piden solo al abrir su pestaña y se descartan cuando cambia algo.
    let metricas = null;
    let despachos = null;
    const pidiendo = {};
    const fallo = {};
    const filtros = { q: "", preset: "todos", plaza: "", area: "", orden: "score" };

    const $ = (id) => document.getElementById(id);

    function el(tag, props, ...hijos) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
        else n.setAttribute(k, v);
      }
      for (const h of hijos) if (h) n.append(h);
      return n;
    }

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("visible");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.classList.remove("visible"), 2200);
    }

    // ---------- Sesión ----------
    function guardarSesion(s) {
      sesion = { access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + s.expires_in * 1000 };
      localStorage.setItem(LS, JSON.stringify(sesion));
    }
    function cerrarSesion() {
      sesion = null;
      datos = null;
      localStorage.removeItem(LS);
      mostrarLogin();
    }
    async function auth(path, body) {
      const r = await fetch(`${SB}/auth/v1/${path}`, {
        method: "POST",
        headers: { apikey: KEY, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error_code || j.msg || "error");
      return j;
    }
    async function token() {
      if (!sesion) throw new Error("sin_sesion");
      if (Date.now() > sesion.expires_at - 60000) {
        guardarSesion(await auth("token?grant_type=refresh_token", { refresh_token: sesion.refresh_token }));
      }
      return sesion.access_token;
    }
    async function rpc(fn, args) {
      const t = await token();
      const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers: { apikey: KEY, Authorization: `Bearer ${t}`, "Content-Type": "application/json" },
        body: JSON.stringify(args || {}),
      });
      const j = await r.json().catch(() => null);
      if (!r.ok) throw new Error((j && j.message) || `Error ${r.status}`);
      return j;
    }

    // ---------- Carga y acciones ----------
    async function cargar() {
      try {
        datos = await rpc("panel_datos");
        metricas = null;
        despachos = null;
      } catch (e) {
        cerrarSesion();
        return;
      }
      if (!datos.autorizado) {
        cerrarSesion();
        $("login-error").textContent = "Esta cuenta no tiene acceso al panel.";
        return;
      }
      $("login").hidden = true;
      $("app").hidden = false;
      $("usuario").hidden = false;
      $("usuario-nombre").textContent = datos.usuario || "";
      pintar();
    }

    async function accion(lead, nombre, boton, extra) {
      if (boton) boton.disabled = true;
      try {
        await rpc("panel_accion", Object.assign({ p_lead: lead.id, p_accion: nombre }, extra || {}));
        toast("Guardado");
        await cargar();
        return true;
      } catch (e) {
        toast(e.message);
        if (boton) boton.disabled = false;
        return false;
      }
    }

    async function copiar(texto, que) {
      try {
        await navigator.clipboard.writeText(texto);
      } catch (e) {
        const ta = el("textarea", {});
        ta.value = texto;
        document.body.append(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      toast(`${que} copiado`);
    }

    // ---------- Piezas de interfaz ----------
    const esLinkedin = (u) => /^https?:\/\/([a-z]{2,3}\.)?linkedin\.com\//i.test(u || "");
    const esWeb = (u) => /^https?:\/\//i.test(u || "");

    function hace(fecha) {
      if (!fecha) return "";
      const dias = Math.floor((Date.now() - new Date(fecha).getTime()) / 86400000);
      return dias <= 0 ? "hoy" : dias === 1 ? "hace 1 día" : `hace ${dias} días`;
    }

    function btn(texto, clase, fn) {
      return el("button", { type: "button", class: `boton ${clase || ""}`.trim(), text: texto, onclick: (ev) => fn(ev.currentTarget) });
    }

    function enlaceLinkedin(lead) {
      if (!esLinkedin(lead.linkedin)) return null;
      return el("a", { class: "boton sec", href: lead.linkedin, target: "_blank", rel: "noopener noreferrer", text: "Abrir LinkedIn" });
    }

    // Segmento (solo se señala si no es el despacho pequeño de siempre) y trato de tú/vosotros.
    const esPrioritario = (o) => !!o.segmento && o.segmento !== "pequeno";
    const badgeSegmento = (o) => (esPrioritario(o) ? el("span", { class: "badge b-seg", text: PL.SEGMENTOS[o.segmento] || o.segmento }) : null);
    const tipoDe = (o) => (o.variante_mensaje === "peq-ind-v2" ? "individual" : "equipo");

    function cabecera(lead, detalle) {
      const meta = [lead.plaza, lead.score != null ? `${lead.score} pts` : null, detalle].filter(Boolean).join(" · ");
      const titulo = el("h3", { text: lead.despacho || "(sin nombre)" });
      const linea = el("p", { class: "meta", text: meta });
      if (esWeb(lead.web)) {
        linea.append(" · ", el("a", { href: lead.web, target: "_blank", rel: "noopener noreferrer", text: "web" }));
      }
      const nodos = [titulo, linea];
      const seg = badgeSegmento(lead);
      if (seg || lead.contacto) nodos.push(el("p", { class: "info-seg" }, seg, lead.contacto ? `Para: ${lead.contacto}` : ""));
      const motivo = PL.motivo(lead.segmento, lead.senales);
      if (motivo) nodos.push(el("p", { class: "nota", text: motivo }));
      return nodos;
    }

    function tarjetaNueva(lead) {
      const perfil = lead.perfil_persona ? "perfil de persona" : lead.linkedin ? "página de empresa" : "sin perfil localizado";
      const aviso = lead.perfil_persona ? null
        : lead.linkedin ? "Es la página del despacho: entra en «Personas», busca al socio o titular y envíale a él la solicitud."
        : "No tenemos su perfil: busca el despacho en LinkedIn, entra en «Personas» y envía la solicitud a un socio o a quien lleve procesal.";
      return el("article", { class: "tarjeta" },
        ...cabecera(lead, perfil),
        aviso ? el("p", { class: "aviso", text: aviso }) : null,
        el("div", { class: "texto-msg", text: lead.nota || "" }),
        el("p", { class: "nota", text: `${/^Hola,/.test(lead.nota || "") ? "Añade su nombre después de «Hola»." : "Comprueba que el saludo lleva bien su nombre."} Si el perfil no es de un abogado del despacho, pulsa «Perfil incorrecto».` }),
        el("div", { class: "acciones" },
          enlaceLinkedin(lead),
          !lead.linkedin && esWeb(lead.web) ? el("a", { class: "boton sec", href: lead.web, target: "_blank", rel: "noopener noreferrer", text: "Abrir su web" }) : null,
          btn("Copiar nota", "sec", () => copiar(lead.nota || "", "Nota")),
        ),
        el("div", { class: "acciones" },
          btn("Solicitud enviada", "", (b) => accion(lead, "enviada", b)),
          btn("Saltar hoy", "gris", (b) => accion(lead, "saltar", b)),
          btn("Perfil incorrecto", "gris", (b) => accion(lead, "perfil_incorrecto", b)),
        ),
      );
    }

    function tarjetaMensaje(lead) {
      return el("article", { class: "tarjeta" },
        ...cabecera(lead, `aceptó ${hace(lead.aceptada)}`),
        el("div", { class: "texto-msg", text: lead.mensaje || "" }),
        /^Gracias por aceptar\./.test(lead.mensaje || "") ? el("p", { class: "nota", text: "Puedes añadir su nombre después de «Gracias por aceptar»." }) : null,
        infoLead(lead),
        el("div", { class: "acciones" },
          enlaceLinkedin(lead),
          btn("Copiar mensaje", "sec", () => copiar(lead.mensaje || "", "Mensaje")),
          btnFicha(lead),
        ),
        el("div", { class: "acciones" },
          btn("Mensaje enviado", "", (b) => accion(lead, "mensaje_enviado", b)),
          btn("Deshacer «aceptó»", "gris", (b) => accion(lead, "deshacer", b)),
        ),
      );
    }

    function noInteresa(lead, b) {
      if (confirm(`¿Marcar «${lead.despacho}» como no interesado? No se le volverá a contactar.`)) accion(lead, "no_interesa", b);
    }
    // Hitos del producto: se marcan cuando la persona lo dice en la conversación.
    function marcarPublico(lead, b) {
      if (confirm(`¿«${lead.despacho}» te ha dicho que ya ha publicado su primera vista en TogApp?`)) return accion(lead, "publico", b);
      return Promise.resolve(false);
    }
    function abrirOptin(lead) {
      optinLead = lead;
      $("form-optin").reset();
      $("optin-error").textContent = "";
      $("dlg-optin").showModal();
    }

    // Seguimiento programado y última nota, para verlos sin abrir la ficha.
    function infoLead(lead) {
      const f = document.createDocumentFragment();
      if (lead.registrado && !lead.publico) {
        f.append(el("p", { class: "info-seg" }, el("span", { class: "badge b-logro", text: `Abrió cuenta el ${diaCorto(lead.registrado)}` })));
      }
      if (lead.seguimiento) {
        const vencido = datos.hoy && lead.seguimiento <= datos.hoy;
        f.append(el("p", { class: "info-seg" },
          el("span", { class: `badge ${vencido ? "b-activo" : "b-neutro"}`, text: `Seguimiento ${diaCorto(lead.seguimiento)}` }),
          lead.seguimiento_nota || ""));
      }
      if (lead.ultima_nota) {
        const t = lead.ultima_nota.texto;
        f.append(el("p", { class: "ultima-nota" }, t.length > 160 ? `${t.slice(0, 160)}…` : t, " ",
          el("small", { text: `— ${lead.ultima_nota.autor}, ${diaCorto(lead.ultima_nota.fecha)}${lead.n_notas > 1 ? ` · ${lead.n_notas} notas` : ""}` })));
      }
      return f;
    }
    const btnFicha = (lead) => btn(lead.n_notas ? `Notas (${lead.n_notas}) y seguimiento` : "Notas y seguimiento", "sec", () => abrirFicha(lead));

    function tarjetaCurso(lead, detalle, botones) {
      return el("article", { class: "tarjeta" },
        ...cabecera(lead, detalle),
        infoLead(lead),
        el("div", { class: "acciones" }, enlaceLinkedin(lead), btnFicha(lead)),
        el("div", { class: "acciones" }, ...botones),
      );
    }

    // Texto del único seguimiento suave: solo si envió el primer mensaje, no hubo respuesta y aún
    // no se le ha hecho ninguno. Después de uno no se insiste.
    function textoSeguimiento(o) {
      if (o.stage !== "connected" || !o.mensaje_enviado) return null;
      if (o.seguimientos_hechos >= 1) return { hecho: true };
      return PL.seguimiento({ segmento: o.segmento, tipo: tipoDe(o) });
    }

    function tarjetaSeguimiento(lead) {
      const atraso = lead.seguimiento < datos.hoy ? `tocaba el ${diaCorto(lead.seguimiento)}` : "toca hoy";
      const seg = textoSeguimiento(lead);
      return el("article", { class: "tarjeta" },
        ...cabecera(lead, atraso),
        el("div", { class: "texto-msg", text: lead.seguimiento_nota || "Seguimiento pendiente" }),
        seg && seg.hecho ? el("p", { class: "aviso", text: "Ya le enviaste un seguimiento: no insistas más." }) : null,
        seg && seg.texto ? el("div", { class: "texto-msg", text: seg.texto }) : null,
        lead.ultima_nota ? el("p", { class: "ultima-nota" }, lead.ultima_nota.texto, " ",
          el("small", { text: `— ${lead.ultima_nota.autor}, ${diaCorto(lead.ultima_nota.fecha)}` })) : null,
        el("div", { class: "acciones" }, enlaceLinkedin(lead),
          seg && seg.texto ? btn("Copiar seguimiento", "sec", () => copiar(seg.texto, "Seguimiento")) : null,
          btnFicha(lead)),
        el("div", { class: "acciones" },
          btn("Hecho", "", (b) => seguimiento(lead, null, null, true, b)),
          btn("Posponer 3 días", "gris", (b) => seguimiento(lead, sumaDias(datos.hoy, 3), lead.seguimiento_nota, false, b)),
        ),
      );
    }

    function seccion(titulo, items, render, vacio) {
      const s = el("section", {}, el("h2", { text: `${titulo} (${items.length})` }));
      if (!items.length) s.append(el("p", { class: "vacio", text: vacio }));
      else s.append(el("div", { class: "rejilla" }, ...items.map(render)));
      return s;
    }

    // ---------- Vistas ----------
    function vistaHoy() {
      const d = datos, f = document.createDocumentFragment();
      let estado = `Hoy llevas ${d.enviadas_hoy} de ${d.cap} solicitudes.`;
      if (d.enviadas_hoy >= d.cap) estado += " Tope de hoy alcanzado: mañana más.";
      f.append(el("p", { class: "progreso", text: estado }));
      const cs = d.cola_segmentos || {};
      if (cs.recurrente || cs.masivo) {
        const partes = [["recurrente", "despachos recurrentes"], ["masivo", "de litigación masiva"], ["pequeno", "despachos pequeños"]]
          .filter(([k]) => cs[k]).map(([k, t]) => `${num(cs[k])} ${t}`);
        f.append(el("p", { class: "nota", text: `En cola, por este orden: ${partes.join(" · ")}.` }));
      }
      if (d.seguimientos.length) {
        f.append(seccion("Seguimientos que tocan", d.seguimientos, tarjetaSeguimiento, ""));
      }
      if (d.por_mensaje.length) {
        f.append(seccion("Han aceptado: envíales el primer mensaje", d.por_mensaje, tarjetaMensaje, ""));
      }
      f.append(seccion("Solicitudes nuevas", d.nuevas, tarjetaNueva,
        d.enviadas_hoy >= d.cap ? "Ya has enviado las de hoy." : "No quedan contactos en la cola."));
      return f;
    }

    function vistaCurso() {
      const d = datos, f = document.createDocumentFragment();
      f.append(seccion("Pendientes de aceptación", d.pendientes_aceptacion, (l) =>
        tarjetaCurso(l, `solicitud enviada ${hace(l.enviada)}`, [
          btn("Aceptó", "", (b) => accion(l, "acepto", b)),
          btn("No interesa", "gris", (b) => noInteresa(l, b)),
          btn("Deshacer envío", "gris", (b) => accion(l, "deshacer", b)),
        ]), "Nadie pendiente de aceptar."));
      f.append(seccion("Mensaje enviado, esperando respuesta", d.esperando_respuesta, (l) =>
        tarjetaCurso(l, `mensaje enviado ${hace(l.mensaje_enviado)}`, [
          btn("Respondió", "", (b) => accion(l, "respondio", b)),
          btn("Abrió cuenta", "sec", (b) => accion(l, "registrado", b)),
          btn("Dio permiso para email", "sec", () => abrirOptin(l)),
          btn("No interesa", "gris", (b) => noInteresa(l, b)),
          btn("Deshacer", "gris", (b) => accion(l, "deshacer", b)),
        ]), "Nadie esperando respuesta."));
      f.append(seccion("En conversación", d.en_conversacion, (l) =>
        tarjetaCurso(l, `aceptó ${hace(l.aceptada)}`, [
          btn("Abrió cuenta", "", (b) => accion(l, "registrado", b)),
          btn("Dio permiso para email", "sec", () => abrirOptin(l)),
          btn("No interesa", "gris", (b) => noInteresa(l, b)),
          btn("Deshacer", "gris", (b) => accion(l, "deshacer", b)),
        ]), "Ninguna conversación abierta."));
      const reg = d.registrados || [];
      if (reg.length) {
        f.append(seccion("Abrieron cuenta: aún no han publicado", reg, (l) =>
          tarjetaCurso(l, `abrió cuenta ${hace(l.registrado)}`, [
            btn("Publicó su primera vista", "", (b) => marcarPublico(l, b)),
            ["connected", "in_conversation"].includes(l.stage) ? btn("Dio permiso para email", "sec", () => abrirOptin(l)) : null,
            ["connect_sent", "connected", "in_conversation"].includes(l.stage) ? btn("No interesa", "gris", (b) => noInteresa(l, b)) : null,
            btn("Deshacer «abrió cuenta»", "gris", (b) => accion(l, "deshacer_hito", b)),
          ]), ""));
      }
      return f;
    }

    // ---------- Carga perezosa de métricas y despachos ----------
    async function pedir(que) {
      if (pidiendo[que]) return;
      pidiendo[que] = true;
      fallo[que] = false;
      try {
        const d = await rpc(que === "metricas" ? "panel_metricas" : "panel_despachos");
        if (que === "metricas") {
          metricas = d;
          try { metricas.clics = await rpc("panel_clics"); } catch (e) { metricas.clics = []; }
        } else despachos = d;
      } catch (e) {
        fallo[que] = true;
        toast(e.message);
      }
      pidiendo[que] = false;
      if (datos) pintar();
    }
    function esperando(que) {
      if (fallo[que]) {
        return el("div", { class: "vacio" }, "No se han podido cargar los datos. ",
          btn("Reintentar", "sec", () => { fallo[que] = false; pintar(); }));
      }
      pedir(que);
      return el("p", { class: "vacio", text: "Cargando…" });
    }

    // ---------- Gráficos ----------
    const num = (n) => Number(n || 0).toLocaleString("es-ES");
    const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "–");
    const tip = $("tip");

    function mostrarTip(ev, filas, titulo) {
      tip.replaceChildren();
      if (titulo) tip.append(el("div", { class: "tip-titulo", text: titulo }));
      for (const f of filas) {
        tip.append(el("div", {},
          f.color ? el("span", { class: "tip-clave", style: `background:${f.color}` }) : null,
          el("strong", { text: f.valor }), ` ${f.etiqueta}`));
      }
      tip.hidden = false;
      const r = ev.currentTarget.getBoundingClientRect();
      const conPuntero = ev.type !== "focus" && ev.clientX != null;
      const x = conPuntero ? ev.clientX : r.left + r.width / 2;
      const y = conPuntero ? ev.clientY : r.top;
      tip.style.left = `${Math.max(8, Math.min(x + 12, window.innerWidth - tip.offsetWidth - 8))}px`;
      tip.style.top = `${Math.max(8, y - tip.offsetHeight - 10)}px`;
    }
    function conTip(nodo, fn) {
      nodo.setAttribute("tabindex", "0");
      for (const t of ["pointerenter", "pointermove", "focus"]) nodo.addEventListener(t, (ev) => mostrarTip(ev, ...fn()));
      for (const t of ["pointerleave", "blur"]) nodo.addEventListener(t, () => { tip.hidden = true; });
    }

    // Barras horizontales de una sola serie (un color): cada valor va escrito en la punta.
    function graficoBarras(titulo, sub, items) {
      const max = Math.max(1, ...items.map((i) => i.n));
      const cont = el("div", { class: "barras" });
      for (const it of items) {
        const val = el("span", { class: "val", text: num(it.n) });
        if (it.extra) val.append(" ", el("small", { text: it.extra }));
        const fila = el("div", { class: "fila" },
          el("div", { class: "lbl", text: it.nombre }),
          el("div", { class: "pista" },
            el("div", { class: "barra", style: `width: calc((100% - 7.5rem) * ${(it.n / max).toFixed(4)})` }), val));
        conTip(fila, () => [[{ valor: num(it.n), etiqueta: it.extra ? `${it.nombre} · ${it.extra}` : it.nombre }]]);
        cont.append(fila);
      }
      return el("section", { class: "grafico viz" }, el("h3", { text: titulo }), sub ? el("p", { class: "sub", text: sub }) : null, cont);
    }

    const SERIES = [
      { clave: "enviadas", nombre: "Solicitudes enviadas", color: "var(--serie-1)" },
      { clave: "aceptadas", nombre: "Aceptadas", color: "var(--serie-2)" },
      { clave: "respondieron", nombre: "Respondieron", color: "var(--serie-3)" },
    ];
    const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    // Acepta una fecha (2026-10-08) o un instante (con hora): el instante se pasa a hora local.
    const diaCorto = (v) => {
      const s = String(v);
      if (s.length > 10) { const d = new Date(s); return `${d.getDate()} ${MESES[d.getMonth()]}`; }
      const p = s.split("-").map(Number);
      return `${p[2]} ${MESES[p[1] - 1]}`;
    };
    const sumaDias = (iso, n) => {
      const p = iso.split("-").map(Number);
      return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
    };
    const svgEl = (tag, attrs) => {
      const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
      return n;
    };

    // Columnas agrupadas por semana (3 series, un solo eje). Se dibuja al ancho real del contenedor.
    function graficoSemanal(semanas) {
      const caja = el("div", { class: "lienzo" });
      function dibujar() {
        const W = Math.max(280, Math.floor(caja.clientWidth)), H = 220;
        const m = { l: 30, r: 6, t: 16, b: 26 };
        const pw = W - m.l - m.r, ph = H - m.t - m.b, base = m.t + ph;
        const maxV = Math.max(4, ...semanas.flatMap((s) => SERIES.map((x) => s[x.clave])));
        const paso = Math.ceil(maxV / 4), tope = paso * 4;
        const y = (v) => m.t + ph - (v / tope) * ph;
        const svg = svgEl("svg", { width: W, height: H, role: "img", "aria-label": "Actividad por semana" });
        for (let i = 0; i <= 4; i++) {
          const v = i * paso;
          svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), style: `stroke: var(${i === 0 ? "--eje" : "--rejilla"}); stroke-width: 1` }));
          const t = svgEl("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", class: "eje" });
          t.textContent = num(v);
          svg.append(t);
        }
        const bw = pw / semanas.length;
        const cw = Math.max(4, Math.min(14, (bw - 10) / 3 - 2));
        semanas.forEach((s, i) => {
          const x0 = m.l + i * bw, gx = x0 + (bw - (3 * cw + 4)) / 2, ultima = i === semanas.length - 1;
          SERIES.forEach((ser, k) => {
            const v = s[ser.clave];
            if (!v) return;
            const h = (v / tope) * ph, x = gx + k * (cw + 2), yy = y(v), r = Math.min(4, h, cw / 2);
            svg.append(svgEl("path", {
              d: `M${x},${base} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + cw - r} Q${x + cw},${yy} ${x + cw},${yy + r} V${base} Z`,
              style: `fill: ${ser.color}`,
            }));
            if (ultima) {
              const t = svgEl("text", { x: x + cw / 2, y: yy - 4, "text-anchor": "middle", class: "cap" });
              t.textContent = num(v);
              svg.append(t);
            }
          });
          if (bw >= 40 || i % 2 === (semanas.length - 1) % 2) {
            const tx = svgEl("text", { x: x0 + bw / 2, y: H - 8, "text-anchor": "middle", class: "eje" });
            tx.textContent = diaCorto(s.lunes);
            svg.append(tx);
          }
          const banda = svgEl("rect", { x: x0, y: m.t, width: bw, height: ph, class: "banda" });
          conTip(banda, () => [SERIES.map((ser) => ({ color: ser.color, valor: num(s[ser.clave]), etiqueta: ser.nombre })), `Semana del ${diaCorto(s.lunes)}`]);
          svg.append(banda);
        });
        caja.replaceChildren(svg);
      }
      new ResizeObserver(dibujar).observe(caja);

      const tabla = el("table", { class: "tabla-num" },
        el("tr", {}, el("th", { text: "Semana del" }), ...SERIES.map((s) => el("th", { text: s.nombre }))));
      for (const s of semanas) tabla.append(el("tr", {}, el("td", { text: diaCorto(s.lunes) }), ...SERIES.map((x) => el("td", { text: num(s[x.clave]) }))));
      return el("section", { class: "grafico viz" },
        el("h3", { text: "Actividad por semana" }),
        el("p", { class: "sub", text: "Últimas 8 semanas. Cada cosa cuenta en la semana en que ocurrió." }),
        el("div", { class: "leyenda" }, ...SERIES.map((s) => el("span", {}, el("i", { style: `background:${s.color}` }), s.nombre))),
        caja,
        el("details", { class: "tabla-alt" }, el("summary", { text: "Ver como tabla" }), el("div", { class: "desliza" }, tabla)));
    }

    function tablaSegmentos(segmentos) {
      const tabla = el("table", { class: "tabla-num" },
        el("tr", {}, el("th", { text: "Segmento" }), el("th", { text: "Enviadas" }), el("th", { text: "Aceptadas" }),
          el("th", { text: "% acept." }), el("th", { text: "Respond." }), el("th", { text: "% resp." }),
          el("th", { text: "Cuenta" }), el("th", { text: "Publicó" })));
      // Dentro de cada grupo, orden con sentido (no alfabético). Segmentos y plantillas llegan
      // como identificador y se muestran con su nombre.
      const ORDEN = [...Object.keys(PL.SEGMENTOS), "Perfil de persona", "Página de empresa", "Sin perfil localizado",
        "85 o más", "70 a 84", "Menos de 70", "Sin puntuar", "Madrid capital", "Resto de la provincia", "Fuera de Madrid",
        ...Object.keys(PL.VARIANTES)];
      const nombre = (s) => PL.SEGMENTOS[s] || PL.VARIANTES[s] || s;
      const grupos = [...new Set(segmentos.map((s) => s.grupo))];
      segmentos = [...segmentos].sort((a, b) => grupos.indexOf(a.grupo) - grupos.indexOf(b.grupo) || ORDEN.indexOf(a.segmento) - ORDEN.indexOf(b.segmento));
      let grupo = null;
      for (const s of segmentos) {
        const mensaje = s.grupo === "Primer mensaje";
        if (s.grupo !== grupo) {
          grupo = s.grupo;
          tabla.append(el("tr", { class: "grupo" }, el("td", { colspan: "8", text: mensaje ? `${grupo} (sobre los mensajes enviados)` : grupo })));
        }
        tabla.append(el("tr", {}, el("td", { text: nombre(s.segmento) }), el("td", { text: num(s.enviadas) }),
          el("td", { text: mensaje ? "–" : num(s.aceptadas) }), el("td", { text: mensaje ? "–" : pct(s.aceptadas, s.enviadas) }),
          el("td", { text: num(s.respondieron) }), el("td", { text: pct(s.respondieron, s.enviadas) }),
          el("td", { text: num(s.registrados) }), el("td", { text: num(s.publicaron) })));
      }
      return el("section", { class: "grafico" },
        el("h3", { text: "¿Qué funciona mejor?" }),
        el("p", { class: "sub", text: "Aceptación, respuesta, cuentas abiertas y primeras vistas publicadas según el tipo de contacto y el texto enviado. Con pocas solicitudes las diferencias no son fiables: espera a tener unas 30 por fila antes de sacar conclusiones." }),
        el("div", { class: "desliza" }, tabla));
    }

    const AREAS = { extranjeria: "extranjería", proteccion_datos: "protección de datos", propiedad_intelectual: "propiedad intelectual" };
    const nombreArea = (a) => { const t = AREAS[a] || a; return t.charAt(0).toUpperCase() + t.slice(1); };

    const CAMPANAS = { "li-respuesta": "Enlaces de las respuestas rápidas", "landing-despachos": "Landing: bloque para despachos", "landing-registro": "Landing: registro de abogados", guia: "Guía: enlaces a TogApp" };
    function nombreCampana(slug) {
      const post = CONTENIDO.find((p) => p.campana === slug);
      return post ? `Publicación «${post.titulo}»` : CAMPANAS[slug] || slug;
    }

    function vistaResultados() {
      const r = datos.resultados, f = document.createDocumentFragment();
      const tiles = [
        [num(r.enviadas), "Solicitudes enviadas"],
        [r.enviadas ? `${num(r.aceptadas)} (${pct(r.aceptadas, r.enviadas)})` : "0", "Aceptadas"],
        [num(r.mensajes), "Primeros mensajes enviados"],
        [num(r.en_conversacion), "En conversación ahora"],
        [num(r.registrados), "Abrieron cuenta"],
        [num(r.publicaron), "Publicaron su primera vista"],
        [num(r.optins), "Permisos de email"],
        [num(r.no_interesa), "No interesados"],
        [num(r.perfiles_incorrectos), "Perfiles incorrectos"],
        [num(datos.cola_total), "Contactos en cola"],
      ];
      const grid = el("div", { class: "tiles" });
      for (const [valor, lbl] of tiles) grid.append(el("div", { class: "tile" }, el("div", { class: "num", text: valor }), el("div", { class: "lbl", text: lbl })));
      f.append(grid);
      if (!metricas) { f.append(esperando("metricas")); return f; }

      const c = metricas.embudo_contacto, e = metricas.embudo_datos;
      if (!c.enviadas) {
        f.append(el("p", { class: "aviso", text: "Todavía no hay solicitudes marcadas como enviadas. Los gráficos de contacto se irán llenando según las vayáis marcando en «Hoy»." }));
      }
      const de = (n) => (c.enviadas ? `${pct(n, c.enviadas)} de las enviadas` : "");
      f.append(el("h2", { text: "Contacto por LinkedIn" }));
      f.append(graficoBarras("Embudo de contacto", "De la solicitud a la primera vista publicada en TogApp. «Abrieron cuenta» y «Publicaron» se marcan cuando la persona lo dice en la conversación.", [
        { nombre: "Solicitudes enviadas", n: c.enviadas },
        { nombre: "Aceptaron", n: c.aceptadas, extra: de(c.aceptadas) },
        { nombre: "Primer mensaje enviado", n: c.mensajes, extra: de(c.mensajes) },
        { nombre: "Respondieron", n: c.respondieron, extra: de(c.respondieron) },
        { nombre: "Abrieron cuenta", n: c.registrados || 0, extra: de(c.registrados || 0) },
        { nombre: "Publicaron su primera vista", n: c.publicaron || 0, extra: de(c.publicaron || 0) },
        { nombre: "Dieron permiso de email", n: c.optins, extra: de(c.optins) },
      ]));
      f.append(graficoSemanal(metricas.semanal));
      f.append(tablaSegmentos(metricas.segmentos));
      const clics = metricas.clics || [];
      if (clics.length) {
        f.append(graficoBarras("Clics en los enlaces", "Últimas 8 semanas, por campaña. Son clics, no personas: no se guarda quién pulsa.",
          clics.map((k) => ({ nombre: nombreCampana(k.campana), n: k.n }))));
      }

      const deTotal = (n) => `${pct(n, e.despachos)} del total`;
      f.append(el("h2", { text: "La base de datos" }));
      f.append(graficoBarras("De despachos encontrados a contactos listos", "Lo que ha ido filtrando el sistema automático.", [
        { nombre: "Despachos encontrados", n: e.despachos },
        { nombre: "Con página web", n: e.con_web, extra: deTotal(e.con_web) },
        { nombre: "Con algún contacto", n: e.con_contacto, extra: deTotal(e.con_contacto) },
        { nombre: "Con LinkedIn", n: e.con_linkedin, extra: deTotal(e.con_linkedin) },
        { nombre: "Listos para contactar (50 puntos o más, o elegidos a mano)", n: e.contactables, extra: deTotal(e.contactables) },
        { nombre: "Clasificados como despacho recurrente", n: e.recurrentes || 0, extra: deTotal(e.recurrentes || 0) },
      ]));
      f.append(graficoBarras("Puntuación de los contactos", "Cuántos contactos hay en cada tramo (de 0 a 100).", metricas.scores));
      const otras = metricas.plazas.filter((p) => p.nombre === "Otras plazas");
      f.append(graficoBarras("Despachos por plaza", "Las 8 plazas con más despachos y el resto agrupado.",
        metricas.plazas.filter((p) => p.nombre !== "Otras plazas").concat(otras)));
      f.append(graficoBarras("Áreas de práctica más frecuentes", "Detectadas en las webs; un despacho puede tener varias.",
        metricas.areas.map((a) => ({ nombre: nombreArea(a.nombre), n: a.n }))));
      return f;
    }

    // ---------- Piezas comunes: estado, etiquetas, medidor ----------
    const sinTildes = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    function tipoLinkedin(d) {
      if (!d.linkedin) return "Sin LinkedIn";
      return /linkedin\.com\/in\//i.test(d.linkedin) ? "Perfil de persona" : "Página de empresa";
    }
    function estadoDe(d) {
      if (d.publico) return "Publicó";
      if (d.registrado && !["lost", "suppressed"].includes(d.stage)) return "Abrió cuenta";
      switch (d.stage) {
        case null: case undefined: return d.web ? "Sin contacto encontrado" : "Sin página web";
        case "qualified":
          if (d.marcado) return "Perfil incorrecto";
          if (d.manual) return "En cola";
          if (!d.linkedin) return "Sin LinkedIn";
          return d.score < 50 ? "Puntuación baja" : "En cola";
        case "connect_sent": return "Solicitud enviada";
        case "connected": return d.mensaje_enviado ? "Mensaje enviado" : "Aceptó";
        case "in_conversation": return "En conversación";
        case "opted_in": case "nurturing": return "Permiso de email";
        case "won": return "Cliente";
        case "lost": return "No interesa";
        case "suppressed": return "Baja";
        default: return d.stage;
      }
    }
    const CLASE_ESTADO = {
      "En cola": "b-cola", "Solicitud enviada": "b-activo", "Aceptó": "b-activo", "Mensaje enviado": "b-activo",
      "En conversación": "b-activo", "Permiso de email": "b-logro", "Cliente": "b-logro",
      "Abrió cuenta": "b-logro", "Publicó": "b-logro",
      "No interesa": "b-fuera", "Baja": "b-fuera", "Perfil incorrecto": "b-fuera",
    };
    const badgeEstado = (estado) => el("span", { class: `badge ${CLASE_ESTADO[estado] || "b-neutro"}`, text: estado });
    const chip = (texto) => el("span", { class: "chip", text: texto });
    function medidor(n, max, texto) {
      return el("div", { class: "medidor" },
        el("span", { class: "n", text: texto || String(n) }),
        el("div", { class: "pista-m" }, el("i", { style: `width:${Math.max(0, Math.min(100, (n / max) * 100)).toFixed(1)}%` })));
    }

    // ---------- Ficha: detalle del despacho + notas + seguimiento ----------
    async function seguimiento(lead, fecha, nota, hecho, boton) {
      if (boton) boton.disabled = true;
      try {
        await rpc("panel_seguimiento", { p_lead: lead.lead_id !== undefined ? lead.lead_id : lead.id, p_fecha: fecha, p_nota: nota || null, p_hecho: !!hecho });
        toast(hecho ? "Seguimiento hecho" : fecha ? "Seguimiento guardado" : "Seguimiento quitado");
        await cargar();
        return true;
      } catch (e) {
        toast(e.message);
        if (boton) boton.disabled = false;
        return false;
      }
    }

    const DESGLOSE = [
      ["Encaje de sus áreas", "encaje_area", 35], ["Plaza", "plaza", 25], ["Tamaño del despacho", "tamano", 20],
      ["Actividad en sala", "actividad_judicial", 10], ["Facilidad de contacto", "contacto", 10],
    ];

    async function abrirFicha(obj) {
      const leadId = obj.lead_id !== undefined ? obj.lead_id : obj.id;
      $("ficha-titulo").textContent = obj.despacho || "(sin nombre)";
      $("ficha-meta").replaceChildren(...[badgeEstado(estadoDe(obj)), badgeSegmento(obj), obj.plaza ? chip(obj.plaza) : null,
        obj.score != null ? chip(`${obj.score} puntos`) : null].filter(Boolean));
      const c = $("ficha-cuerpo");
      c.replaceChildren();
      const titulo = (t) => c.append(el("h3", { text: t }));

      const motivo = PL.motivo(obj.segmento, obj.senales);
      if (motivo) {
        titulo("Por qué es objetivo");
        c.append(el("p", { text: motivo }));
      }

      if (obj.desglose) {
        titulo("Por qué tiene esta puntuación");
        const g = el("div", { class: "desglose" });
        for (const [nombre, clave, max] of DESGLOSE) {
          const v = Number(obj.desglose[clave] || 0);
          g.append(el("div", { class: "fila-g" }, el("span", { text: nombre }), medidor(v, max, `${v}/${max}`)));
        }
        c.append(g);
        if (obj.resumen) c.append(el("p", { class: "nota", style: "margin-top:0.5rem", text: obj.resumen }));
      }
      if ((obj.areas || []).length) {
        titulo("Áreas de práctica");
        c.append(el("div", { class: "chips" }, ...obj.areas.map((a) => chip(nombreArea(a)))));
      }
      titulo("Datos");
      const datosDespacho = el("div", { class: "chips" });
      if (esWeb(obj.web)) datosDespacho.append(el("a", { class: "boton sec mini", href: obj.web, target: "_blank", rel: "noopener noreferrer", text: "Abrir web" }));
      if (esLinkedin(obj.linkedin)) datosDespacho.append(el("a", { class: "boton sec mini", href: obj.linkedin, target: "_blank", rel: "noopener noreferrer", text: `Abrir LinkedIn (${tipoLinkedin(obj) === "Perfil de persona" ? "persona" : "empresa"})` }));
      if (obj.tiene_email !== undefined && obj.stage) datosDespacho.append(chip(obj.tiene_email ? "Hay email de contacto (solo se usa con permiso)" : "Sin email de contacto"));
      c.append(datosDespacho);
      const hitos = [["Encontrado", obj.descubierto], ["Solicitud enviada", obj.enviada], ["Aceptó", obj.aceptada], ["Mensaje enviado", obj.mensaje_enviado], ["Respondió", obj.respondio], ["Abrió cuenta", obj.registrado], ["Publicó su primera vista", obj.publico]]
        .filter(([, v]) => v).map(([k, v]) => `${k} el ${diaCorto(v)}`);
      if (hitos.length) c.append(el("p", { class: "nota", style: "margin-top:0.6rem", text: hitos.join(" · ") }));

      const zona = el("div", {});
      c.append(zona);
      if (!$("dlg-ficha").open) $("dlg-ficha").showModal();
      if (!leadId) {
        zona.append(el("p", { class: "aviso", style: "margin-top:1rem", text: "No se encontró ningún contacto en su web, así que no entra en la cola de LinkedIn ni admite notas." }));
        return;
      }
      await pintarZonaLead(leadId, zona);
    }

    async function pintarZonaLead(leadId, zona) {
      let f;
      try {
        f = await rpc("panel_ficha", { p_lead: leadId });
      } catch (e) {
        zona.replaceChildren(el("p", { class: "error", text: e.message }));
        return;
      }
      if (!f) { zona.replaceChildren(); return; }
      const lead = { id: leadId };
      const repintar = () => pintarZonaLead(leadId, zona);
      const hoy = datos.hoy;
      const nodos = [];

      // Seguimiento
      nodos.push(el("h3", { text: "Seguimiento" }));
      nodos.push(el("p", { text: f.seguimiento
        ? `Programado para el ${diaCorto(f.seguimiento)}${f.seguimiento_nota ? `: ${f.seguimiento_nota}` : ""}`
        : "Sin seguimiento programado." }));
      const fecha = el("input", { type: "date", min: hoy, "aria-label": "Fecha del seguimiento" });
      fecha.value = f.seguimiento || "";
      const motivo = el("input", { type: "text", maxlength: "200", placeholder: "Qué hay que hacer (opcional)", "aria-label": "Recordatorio" });
      motivo.value = f.seguimiento_nota || "";
      const rapido = (texto, dias) => btn(texto, "gris mini", () => { fecha.value = sumaDias(hoy, dias); });
      nodos.push(el("div", { class: "linea-seg" }, fecha, rapido("+3 días", 3), rapido("+1 semana", 7), rapido("+1 mes", 30)));
      const acciones = el("div", { class: "linea-seg", style: "margin-top:0.45rem" }, motivo,
        btn("Guardar seguimiento", "mini", async (b) => {
          if (!fecha.value) { toast("Elige una fecha"); return; }
          if (await seguimiento(lead, fecha.value, motivo.value, false, b)) repintar();
        }));
      if (f.seguimiento) {
        acciones.append(
          btn("Hecho", "sec mini", async (b) => { if (await seguimiento(lead, null, null, true, b)) repintar(); }),
          btn("Quitar", "gris mini", async (b) => { if (await seguimiento(lead, null, null, false, b)) repintar(); }));
      }
      nodos.push(acciones);
      const seg = textoSeguimiento(f);
      if (seg && seg.hecho) nodos.push(el("p", { class: "aviso", text: "Ya le enviaste un seguimiento: no insistas más." }));
      if (seg && seg.texto) {
        nodos.push(el("p", { class: "nota", style: "margin-top:0.6rem", text: "Si no responde, un único mensaje de seguimiento:" }),
          el("div", { class: "texto-msg", text: seg.texto }),
          btn("Copiar seguimiento", "sec mini", () => copiar(seg.texto, "Seguimiento")));
      }

      // Hitos del producto (lo que la persona cuenta en la conversación)
      const activo = ["connect_sent", "connected", "in_conversation", "opted_in", "nurturing"].includes(f.stage);
      if (activo || f.registrado || f.publico) {
        nodos.push(el("h3", { text: "En TogApp" }));
        nodos.push(el("p", { text: f.publico ? `Publicó su primera vista el ${diaCorto(f.publico)}.`
          : f.registrado ? `Abrió cuenta el ${diaCorto(f.registrado)}. Aún no ha publicado.`
          : "Márcalo cuando te diga que ha abierto cuenta o que ha publicado una vista." }));
        const tras = async (ok) => { if (await ok) repintar(); };
        nodos.push(el("div", { class: "linea-seg" },
          activo && !f.registrado ? btn("Abrió cuenta", "sec mini", (b) => tras(accion(lead, "registrado", b))) : null,
          activo && !f.publico ? btn("Publicó su primera vista", "mini", (b) => tras(marcarPublico({ id: leadId, despacho: $("ficha-titulo").textContent }, b))) : null,
          f.registrado || f.publico ? btn("Deshacer", "gris mini", (b) => tras(accion(lead, "deshacer_hito", b))) : null));
      }

      // Respuestas rápidas
      if (f.stage && f.stage !== "qualified") {
        const resp = PL.respuestas({ segmento: f.segmento, tipo: tipoDe(f) });
        if (resp.length) {
          nodos.push(el("h3", { text: "Respuestas rápidas" }));
          nodos.push(el("p", { class: "nota", text: "Según lo que te conteste. Adáptala a la conversación antes de enviarla." }));
          for (const r of resp) {
            nodos.push(el("details", { class: "respuesta" }, el("summary", { text: r.objecion }),
              el("div", { class: "texto-msg", text: r.texto }),
              btn("Copiar respuesta", "sec mini", () => copiar(r.texto, "Respuesta"))));
          }
        }
      }

      // Notas
      nodos.push(el("h3", { text: `Notas de la conversación (${f.notas.length})` }));
      const texto = el("textarea", { rows: "3", maxlength: "2000", placeholder: "Qué te ha dicho, objeciones, cuándo volver a escribir…", "aria-label": "Nueva nota" });
      nodos.push(texto);
      nodos.push(el("div", { class: "linea-seg", style: "margin-top:0.4rem" },
        btn("Añadir nota", "mini", async (b) => {
          if (!texto.value.trim()) { toast("Escribe la nota"); return; }
          b.disabled = true;
          try {
            await rpc("panel_nota", { p_lead: leadId, p_texto: texto.value });
            toast("Nota guardada");
            cargar();
            repintar();
          } catch (e) { toast(e.message); b.disabled = false; }
        }),
        el("span", { class: "nota", text: "No escribas datos sensibles ni detalles de expedientes." })));
      for (const n of f.notas) {
        const quien = el("div", { class: "quien" }, `${n.autor} · ${diaCorto(n.fecha)}`);
        if (n.mia) {
          quien.append(el("button", { type: "button", text: "Borrar", onclick: async () => {
            if (!confirm("¿Borrar esta nota?")) return;
            try { await rpc("panel_borrar_nota", { p_nota: n.id }); cargar(); repintar(); } catch (e) { toast(e.message); }
          } }));
        }
        nodos.push(el("div", { class: "nota-item" }, quien, el("div", { class: "txt", text: n.texto })));
      }

      // Mensajes preparados
      if (f.nota || f.mensaje) {
        const plantilla = [f.variante_nota, f.variante_mensaje].filter(Boolean).map((v) => PL.VARIANTES[v] || v).join(" / ");
        const det = el("details", { class: "tabla-alt" }, el("summary", { text: plantilla ? `Ver los mensajes preparados (${plantilla})` : "Ver los mensajes preparados" }));
        if (f.nota) det.append(el("div", { class: "texto-msg", text: f.nota }), btn("Copiar nota", "sec mini", () => copiar(f.nota, "Nota")));
        if (f.mensaje) det.append(el("div", { class: "texto-msg", text: f.mensaje }), btn("Copiar mensaje", "sec mini", () => copiar(f.mensaje, "Mensaje")));
        nodos.push(det);
      }
      zona.replaceChildren(...nodos);
    }

    // ---------- Pestaña Despachos: todo lo que ha recogido el sistema ----------
    const PRESETS = [
      ["todos", "Todos", () => true],
      ["cola", "En cola", (d) => estadoDe(d) === "En cola"],
      ["recurrentes", "Recurrentes", (d) => d.segmento === "recurrente"],
      ["sinpersona", "Prioritarios sin persona", (d) => esPrioritario(d) && tipoLinkedin(d) !== "Perfil de persona"],
      ["contactados", "Contactados", (d) => !!d.enviada],
      ["cuenta", "Abrieron cuenta", (d) => !!d.registrado],
      ["seguimiento", "Con seguimiento", (d) => !!d.seguimiento],
      ["notas", "Con notas", (d) => d.n_notas > 0],
      ["sinlinkedin", "Con contacto, sin LinkedIn", (d) => !!d.stage && !d.linkedin],
      ["sincontacto", "Sin contacto", (d) => !d.stage],
    ];

    function filaDespacho(d) {
      const dominio = esWeb(d.web) ? d.web.replace(/^https?:\/\/(www\.)?/i, "").split(/[/?]/)[0] : null;
      const sub = [esPrioritario(d) ? (PL.SEGMENTOS[d.segmento] || d.segmento) : null, dominio,
        d.linkedin ? `LinkedIn de ${tipoLinkedin(d) === "Perfil de persona" ? "persona" : "empresa"}` : null,
        d.n_notas ? `${d.n_notas} nota${d.n_notas > 1 ? "s" : ""}` : null,
        d.seguimiento ? `seguimiento ${diaCorto(d.seguimiento)}` : null].filter(Boolean).join(" · ");
      const areas = (d.areas || []).map(nombreArea);
      const fila = el("div", { class: "fila-d", role: "button", tabindex: "0" },
        el("div", { class: "c-nombre" }, el("div", { class: "nombre", text: d.despacho || "(sin nombre)" }), sub ? el("div", { class: "sub-d", text: sub }) : null),
        el("div", { class: "c-plaza", text: d.plaza || "—" }),
        el("div", { class: "c-score" }, d.score != null ? medidor(d.score, 100) : el("span", { class: "sub-d", text: "sin puntuar" })),
        el("div", { class: "c-estado" }, badgeEstado(estadoDe(d))),
        el("div", { class: "c-areas chips" }, ...areas.slice(0, 3).map(chip), areas.length > 3 ? chip(`+${areas.length - 3}`) : null));
      fila.addEventListener("click", () => abrirFicha(d));
      fila.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrirFicha(d); } });
      return fila;
    }

    function vistaDespachos() {
      if (!despachos) return esperando("despachos");
      const opciones = (valores, todos, etiqueta) => [el("option", { value: "", text: todos }), ...valores.map((v) => el("option", { value: v, text: etiqueta ? etiqueta(v) : v }))];
      const orden = (a, b) => a.localeCompare(b, "es");
      const plazas = [...new Set(despachos.map((d) => d.plaza).filter(Boolean))].sort(orden);
      const areas = [...new Set(despachos.flatMap((d) => d.areas || []))].sort((a, b) => orden(nombreArea(a), nombreArea(b)));

      const buscador = el("input", { type: "search", placeholder: "Buscar despacho…", "aria-label": "Buscar despacho" });
      const selPlaza = el("select", { "aria-label": "Plaza" }, ...opciones(plazas, "Todas las plazas"));
      const selArea = el("select", { "aria-label": "Área de práctica" }, ...opciones(areas, "Todas las áreas", nombreArea));
      const selOrden = el("select", { "aria-label": "Orden" },
        el("option", { value: "score", text: "Orden: puntuación" }), el("option", { value: "nombre", text: "Orden: nombre" }),
        el("option", { value: "recientes", text: "Orden: más recientes" }));
      buscador.value = filtros.q; selPlaza.value = filtros.plaza; selArea.value = filtros.area; selOrden.value = filtros.orden;

      const presets = el("div", { class: "presets" });
      const contador = el("p", { class: "nota" });
      const lista = el("div", { class: "tabla-d" });
      const mas = btn("Mostrar 50 más", "sec", () => { limite += 50; pintarLista(); });
      let limite = 50;

      function pintarLista() {
        const q = sinTildes(filtros.q);
        const resto = (d) => (!q || sinTildes(d.despacho).includes(q)) && (!filtros.plaza || d.plaza === filtros.plaza) &&
          (!filtros.area || (d.areas || []).includes(filtros.area));
        const base = despachos.filter(resto);
        presets.replaceChildren(...PRESETS.map(([clave, nombre, fn]) => {
          const b = el("button", { type: "button", "aria-pressed": String(filtros.preset === clave) }, nombre, el("b", { text: num(base.filter(fn).length) }));
          b.addEventListener("click", () => { filtros.preset = clave; limite = 50; pintarLista(); });
          return b;
        }));
        const vis = base.filter(PRESETS.find((p) => p[0] === filtros.preset)[2]);
        if (filtros.orden === "nombre") vis.sort((a, b) => orden(a.despacho || "", b.despacho || ""));
        if (filtros.orden === "recientes") vis.sort((a, b) => String(b.descubierto).localeCompare(String(a.descubierto)));
        contador.textContent = `${num(vis.length)} de ${num(despachos.length)} despachos. Pulsa uno para ver su ficha.`;
        lista.replaceChildren(
          el("div", { class: "fila-d cab" }, el("div", { text: "Despacho" }), el("div", { text: "Plaza" }), el("div", { text: "Puntuación" }), el("div", { text: "Estado" }), el("div", { text: "Áreas" })),
          ...vis.slice(0, limite).map(filaDespacho));
        if (!vis.length) lista.append(el("p", { class: "vacio", style: "padding:1rem", text: "Ningún despacho con esos filtros." }));
        mas.hidden = vis.length <= limite;
      }
      const cambiar = (clave, nodo) => nodo.addEventListener(nodo === buscador ? "input" : "change", () => { filtros[clave] = nodo.value; limite = 50; pintarLista(); });
      cambiar("q", buscador); cambiar("plaza", selPlaza); cambiar("area", selArea); cambiar("orden", selOrden);
      pintarLista();

      const f = document.createDocumentFragment();
      f.append(presets, el("div", { class: "filtros" }, buscador, selPlaza, selArea, selOrden), contador, lista, el("div", { class: "acciones" }, mas));
      return f;
    }

    // ---------- Pestaña Contenido: lo que toca publicar esta semana (calendario en contenido.js) ----------
    const REDES = { linkedin: "LinkedIn", instagram: "Instagram", youtube: "YouTube" };
    const PERFILES = { elvira: "perfil de Elvira", empresa: "página de TogApp", ig: "@togappsl", yt: "canal de TogApp" };
    const FORMATOS = { texto: "Texto", video: "Vídeo", carrusel: "Carrusel", reel: "Reel" };
    const INSTRUCCIONES = {
      "linkedin-texto": "Publícala desde tu perfil personal de LinkedIn. El enlace va en el primer comentario, no en el texto: así llega a más gente.",
      "linkedin-video": "Descarga el vídeo cuadrado y súbelo como vídeo nativo (no como enlace) desde tu perfil. Al subirlo, pulsa «Editar» y añade los subtítulos (.srt) y el texto alternativo. El enlace va en el primer comentario. El 16:9 es para la sección «Destacado» del perfil.",
      "linkedin-carrusel": "Descarga el PDF y publícalo desde tu perfil con «Añadir documento»; ponle de título el de la pieza. El enlace va en el primer comentario.",
      "instagram-reel": "Descarga el Reel y prográmalo en Meta Business Suite (Reels → subir vídeo → programar). El único enlace posible es el de la bio.",
      "youtube-video": "Sube el vídeo 16:9 al canal, añade el .srt como subtítulos en español y pon el enlace medido en la descripción.",
    };
    const lunesDe = (iso) => { const d = new Date(`${iso}T12:00:00`); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0, 10); };

    function vistaContenido() {
      const f = document.createDocumentFragment();
      if (!CONTENIDO.length) {
        f.append(el("p", { class: "vacio", text: "Todavía no hay ninguna publicación preparada." }));
        return f;
      }
      const hoy = datos.hoy, lunes = lunesDe(hoy);
      const orden = (a, b) => a.semana.localeCompare(b.semana) || (a.dia === "jueves") - (b.dia === "jueves");
      const aprobada = (p) => (p.estado || "aprobada") === "aprobada";
      const estaSemana = CONTENIDO.filter((p) => p.semana === lunes && aprobada(p)).sort(orden);
      const pendientes = CONTENIDO.filter((p) => !aprobada(p) && p.semana >= lunes).sort(orden);
      const anteriores = CONTENIDO.filter((p) => p.semana < lunes).sort((a, b) => -orden(a, b));
      const proximas = CONTENIDO.filter((p) => p.semana > lunes && aprobada(p)).sort(orden);

      const tarjeta = (p, actual) => {
        const red = p.red || "linkedin", perfil = p.perfil || "elvira", formato = p.formato || "texto";
        const enlace = p.destino && PL.enlace ? PL.enlace(p.campana, p.destino) : null;
        const meta = [`Semana del ${diaCorto(p.semana)}`, p.dia, `${REDES[red] || red} · ${PERFILES[perfil] || perfil}`, FORMATOS[formato] || formato, p.pilar].filter(Boolean).join(" · ");
        const descargas = (p.descargas || []).map((d) => el("a", { class: "boton sec", href: `../${d.ruta}`, download: "", text: `Descargar: ${d.etiqueta}` }));
        return el("article", { class: "tarjeta" },
          el("h3", {}, el("span", { text: p.titulo }), " ", aprobada(p) ? null : el("span", { class: "badge b-activo", text: "Pendiente de tu OK" })),
          el("p", { class: "meta", text: meta }),
          el("div", { class: "texto-msg", text: p.texto }),
          actual && INSTRUCCIONES[`${red}-${formato}`] ? el("p", { class: "nota", text: INSTRUCCIONES[`${red}-${formato}`] }) : null,
          descargas.length ? el("div", { class: "acciones" }, ...descargas) : null,
          el("div", { class: "acciones" },
            btn("Copiar publicación", actual ? "" : "sec", () => copiar(p.texto, "Publicación")),
            enlace ? btn("Copiar enlace para el comentario", "sec", () => copiar(enlace, "Enlace")) : null,
            p.alt ? btn("Copiar texto alternativo", "sec", () => copiar(p.alt, "Texto alternativo")) : null));
      };

      f.append(el("h2", { text: "Esta semana" }));
      if (estaSemana.length) f.append(...estaSemana.map((p) => tarjeta(p, true)));
      else f.append(el("p", { class: "vacio", text: "Esta semana no hay ninguna pieza aprobada. Mira las pendientes de tu OK." }));
      if (pendientes.length) {
        f.append(el("h2", { text: `Pendientes de tu OK (${pendientes.length})` }),
          el("p", { class: "nota", text: "Nada de esto se publica hasta que lo apruebes. Revísalo y dilo por el canal habitual: se marcará como aprobada." }),
          ...pendientes.map((p) => tarjeta(p, false)));
      }
      if (proximas.length) {
        f.append(el("details", { class: "tabla-alt" }, el("summary", { text: `Próximas semanas (${proximas.length})` }), ...proximas.map((p) => tarjeta(p, false))));
      }
      if (anteriores.length) {
        f.append(el("details", { class: "tabla-alt" }, el("summary", { text: `Publicaciones anteriores (${anteriores.length})` }), ...anteriores.map((p) => tarjeta(p, false))));
      }
      return f;
    }

    function pintar() {
      const d = datos;
      const cuenta = { hoy: d.nuevas.length + d.por_mensaje.length + d.seguimientos.length, curso: d.pendientes_aceptacion.length + d.esperando_respuesta.length + d.en_conversacion.length + (d.registrados || []).length };
      const nombres = { hoy: "Hoy", curso: "En curso", resultados: "Resultados", despachos: "Despachos", contenido: "Contenido" };
      for (const b of document.querySelectorAll(".tabs button")) {
        const t = b.dataset.tab;
        b.textContent = cuenta[t] != null ? `${nombres[t]} (${cuenta[t]})` : nombres[t];
        b.setAttribute("aria-selected", String(t === tab));
      }
      tip.hidden = true;
      const vistas = { hoy: vistaHoy, curso: vistaCurso, resultados: vistaResultados, despachos: vistaDespachos, contenido: vistaContenido };
      $("vista").replaceChildren(vistas[tab]());
    }

    function mostrarLogin() {
      $("app").hidden = true;
      $("usuario").hidden = true;
      $("login").hidden = false;
    }

    // ---------- Eventos ----------
    for (const b of document.querySelectorAll(".tabs button")) {
      b.addEventListener("click", () => { tab = b.dataset.tab; pintar(); });
    }
    for (const b of document.querySelectorAll("[data-cerrar]")) {
      b.addEventListener("click", () => b.closest("dialog").close());
    }
    $("btn-salir").addEventListener("click", cerrarSesion);
    $("btn-pass").addEventListener("click", () => { $("form-pass").reset(); $("pass-error").textContent = ""; $("dlg-pass").showModal(); });

    $("form-login").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("login-error").textContent = "";
      try {
        guardarSesion(await auth("token?grant_type=password", { email: $("login-email").value.trim(), password: $("login-pass").value }));
        $("login-pass").value = "";
        await cargar();
      } catch (e) {
        $("login-error").textContent = e.message === "invalid_credentials" ? "Email o contraseña incorrectos." : "No se ha podido entrar. Inténtalo de nuevo.";
      }
    });

    $("form-optin").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const boton = ev.submitter;
      if (boton) boton.disabled = true;
      try {
        await rpc("panel_accion", { p_lead: optinLead.id, p_accion: "optin", p_email: $("optin-email").value, p_texto: $("optin-texto").value });
        $("dlg-optin").close();
        toast("Permiso guardado");
        await cargar();
      } catch (e) {
        $("optin-error").textContent = e.message;
      }
      if (boton) boton.disabled = false;
    });

    $("form-pass").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try {
        const r = await fetch(`${SB}/auth/v1/user`, {
          method: "PUT",
          headers: { apikey: KEY, Authorization: `Bearer ${await token()}`, "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("pass-nueva").value }),
        });
        if (!r.ok) throw new Error();
        $("dlg-pass").close();
        toast("Contraseña cambiada");
      } catch (e) {
        $("pass-error").textContent = "No se ha podido cambiar. Prueba con otra contraseña más larga.";
      }
    });

    // Al volver a la pestaña se recarga, para ver lo que haya marcado la otra persona.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && sesion && !document.querySelector("dialog[open]")) cargar();
    });

    // ---------- Arranque ----------
    try { sesion = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { sesion = null; }
    if (sesion) cargar(); else mostrarLogin();
  </script>
</body>
</html>
